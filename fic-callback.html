<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiC Callback…</title>
  <style>
    body { font-family: system-ui, sans-serif; display:flex; align-items:center;
           justify-content:center; min-height:100vh; margin:0; background:#f8fafc; }
    .box { text-align:center; color:#64748b; max-width:480px; padding:24px; }
    .spinner { width:32px; height:32px; border:3px solid #e2e8f0;
               border-top-color:#6366f1; border-radius:50%;
               animation:spin .8s linear infinite; margin:0 auto 16px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .debug { margin-top:16px; font-family:monospace; font-size:12px;
             background:#f1f5f9; border-radius:8px; padding:12px;
             text-align:left; word-break:break-all; }
    .ok  { color:#16a34a; font-weight:600; }
    .err { color:#dc2626; font-weight:600; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div id="msg">Autorizzazione FiC in corso…</div>
    <div class="debug" id="dbg"></div>
  </div>
  <script>
    (function() {
      var p    = new URLSearchParams(window.location.search);
      var code = p.get('code');
      var err  = p.get('error');
      var desc = p.get('error_description');
      var dbg  = document.getElementById('dbg');
      var msg  = document.getElementById('msg');

      if (code) {
        sessionStorage.setItem('_ficPendingCode', code);
        msg.innerHTML = '<span class="ok">✓ Codice ricevuto</span>';
        dbg.innerHTML = 'code: <b>' + code.substring(0,12) + '…</b><br>lunghezza: ' + code.length + ' char';
      } else if (err) {
        sessionStorage.setItem('_ficOAuthError', desc || err);
        msg.innerHTML = '<span class="err">✗ Errore FiC</span>';
        dbg.innerHTML = 'error: <b>' + err + '</b>' + (desc ? '<br>description: ' + desc : '');
      } else {
        msg.innerHTML = '<span class="err">⚠ Nessun parametro</span>';
        dbg.innerHTML = 'URL ricevuto: ' + window.location.href;
      }

      setTimeout(function() {
        window.location.replace('https://ormiaofficina.netlify.app/ormia-finance');
      }, 3000);
    })();
  </script>
</body>
</html>
