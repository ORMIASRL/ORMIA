<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORMIA — Postazione Timbratura</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#F5F4F1; --surface:#FFFFFF; --border:#E4E2DC;
  --accent:#1B4FD8; --accent-light:#EEF2FF;
  --success:#276749; --success-light:#F0FFF4;
  --danger:#C53030; --danger-light:#FFF5F5;
  --warning:#D97706; --warning-light:#FFFBEB;
  --text:#1A1917; --text2:#6B6A65; --text3:#A09E99;
  --radius:10px; --radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
html, body { height:100%; background:var(--bg); font-family:'DM Sans',sans-serif; color:var(--text); overflow:hidden; }
.app { display:grid; grid-template-rows:auto 1fr; height:100vh; }

/* HEADER */
.header { background:var(--accent); color:white; padding:14px 28px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.header-logo { display:flex; align-items:center; gap:12px; }
.header-logo-icon { width:34px; height:34px; background:rgba(255,255,255,.2); border-radius:8px; display:flex; align-items:center; justify-content:center; }
.header-title { font-size:16px; font-weight:800; }
.header-sub { font-size:11px; opacity:.7; margin-top:1px; }
.header-clock { font-family:'DM Mono',monospace; font-size:22px; font-weight:600; }

/* MAIN */
.main { display:grid; grid-template-columns:390px 1fr; overflow:hidden; }

/* PANELS */
.panel-left { border-right:2px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.panel-right { display:flex; flex-direction:column; overflow:hidden; }

/* SEC TITLE */
.sec-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--text3); }

/* BACK BTN */
.back-btn { display:inline-flex; align-items:center; gap:5px; background:none; border:none; cursor:pointer; font-size:13px; color:var(--text3); font-family:'DM Sans',sans-serif; padding:0; }
.back-btn:hover { color:var(--text); }

/* COMMESSA CARDS */
.com-list { display:flex; flex-direction:column; gap:6px; }
.com-sel-card { background:var(--surface); border:2px solid var(--border); border-radius:var(--radius-lg); padding:12px 14px; cursor:pointer; transition:border-color .15s, background .15s; display:flex; align-items:center; gap:10px; }
.com-sel-card:hover { border-color:var(--accent); background:var(--accent-light); }
.com-sel-card .bar { width:4px; border-radius:4px; align-self:stretch; flex-shrink:0; min-height:40px; }
.com-sel-card.aperta .bar { background:#22c55e; }
.com-sel-card.wip .bar { background:var(--accent); }
.com-sel-card.standby .bar { background:var(--warning); }
.targa-chip { background:#fefce8; border:1.5px solid #ca8a04; border-radius:5px; padding:2px 8px; font-family:'DM Mono',monospace; font-size:11px; font-weight:700; color:#1a1a1a; letter-spacing:1px; white-space:nowrap; flex-shrink:0; }
.stato-chip { display:inline-flex; align-items:center; font-size:10px; font-weight:700; text-transform:uppercase; padding:2px 7px; border-radius:20px; letter-spacing:.3px; }
.stato-chip.aperta { background:#dcfce7; color:#166534; }
.stato-chip.wip { background:var(--accent-light); color:var(--accent); }
.stato-chip.standby { background:var(--warning-light); color:var(--warning); }

/* MEC PICKER */
.mec-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.mec-card { background:var(--surface); border:2px solid var(--border); border-radius:var(--radius-lg); padding:14px 10px; cursor:pointer; text-align:center; transition:border-color .15s, background .15s; }
.mec-card:hover { border-color:var(--accent); background:var(--accent-light); }
.mec-card.active { border-color:var(--accent); background:var(--accent-light); }
.mec-avatar { width:42px; height:42px; border-radius:50%; background:var(--accent); color:white; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; margin:0 auto 7px; }
.mec-avatar.wip-av { background:var(--success); }

/* BADGE INPUT */
.badge-input { width:100%; padding:11px 14px; border:2px solid var(--border); border-radius:var(--radius); font-size:16px; font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:1px; background:var(--bg); transition:border-color .15s; }
.badge-input:focus { outline:none; border-color:var(--accent); background:white; }

/* ACTION BUTTONS */
.action-btn-big { width:100%; padding:15px; border-radius:var(--radius-lg); border:none; cursor:pointer; font-size:15px; font-weight:700; font-family:'DM Sans',sans-serif; display:flex; align-items:center; justify-content:center; gap:8px; transition:opacity .15s, transform .1s; }
.action-btn-big:active { transform:scale(.98); }
.action-btn-big.success { background:#dcfce7; color:#166534; }
.action-btn-big.warning { background:var(--warning-light); color:var(--warning); }
.action-btn-big.danger  { background:var(--danger-light); color:var(--danger); }
.action-btn-big.primary { background:var(--accent); color:white; }
.action-btn-big:disabled { opacity:.35; cursor:not-allowed; transform:none; }

/* COM DETAIL */
.com-detail { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; box-shadow:var(--shadow); }
.com-detail-num { font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; }
.com-detail-desc { font-size:15px; font-weight:800; margin:3px 0 5px; }

/* CALENDAR NAV (day view) */
.cal-nav { padding:14px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.cal-nav-btn { background:none; border:1px solid var(--border); border-radius:8px; width:32px; height:32px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.cal-nav-btn:hover { background:var(--surface); }
.cal-date-label { font-size:15px; font-weight:800; }
.cal-oggi-chip { font-size:11px; background:var(--accent); color:white; padding:2px 8px; border-radius:10px; font-weight:600; cursor:pointer; border:none; font-family:'DM Sans',sans-serif; }
.cal-events { flex:1; overflow-y:auto; padding:8px 24px 16px; }
.cal-event { padding:11px 12px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:10px; border-radius:var(--radius); cursor:default; }
.cal-event:hover { background:var(--surface); }
.cal-event-time { font-family:'DM Mono',monospace; font-size:13px; font-weight:700; width:46px; flex-shrink:0; padding-top:1px; }
.cal-add-bar { padding:12px 24px; border-top:1px solid var(--border); flex-shrink:0; }
.cal-add-btn { display:flex; align-items:center; gap:6px; background:var(--accent); color:white; border:none; border-radius:var(--radius); padding:10px 18px; font-size:13px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; }
.cal-add-btn:hover { opacity:.9; }
.cal-empty { padding:48px 0; text-align:center; color:var(--text3); font-size:14px; }

/* MONTH CALENDAR GRID */
.cal-month-header { padding:14px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.cal-month-body { flex:1; overflow-y:auto; padding:14px 20px; display:flex; flex-direction:column; gap:8px; }
.cal-dow-row { display:grid; grid-template-columns:repeat(7,1fr); }
.cal-dow-cell { text-align:center; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text3); padding:4px 0 8px; }
.cal-days-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal-day-cell { border-radius:var(--radius); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:4px; padding:8px 4px 6px; transition:background .1s; min-height:52px; }
.cal-day-cell:hover { background:var(--accent-light); }
.cal-day-cell.other-month { opacity:.35; }
.cal-day-cell.today .cal-day-num { background:var(--accent); color:white; border-radius:50%; }
.cal-day-num { font-size:13px; font-weight:700; width:26px; height:26px; display:flex; align-items:center; justify-content:center; }
.cal-day-dots { display:flex; gap:3px; flex-wrap:wrap; justify-content:center; }
.cal-day-dot { width:5px; height:5px; border-radius:50%; }

/* APT FORM */
.apt-form { flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:14px; }
.form-group { display:flex; flex-direction:column; gap:5px; }
.form-label { font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
.form-input { padding:11px 14px; border:2px solid var(--border); border-radius:var(--radius); font-size:14px; font-family:'DM Sans',sans-serif; background:var(--bg); transition:border-color .15s; }
.form-input:focus { outline:none; border-color:var(--accent); background:white; }

/* TOAST */
#toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#1A1917; color:white; padding:12px 24px; border-radius:20px; font-size:14px; font-weight:500; z-index:9999; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.dot { width:8px; height:8px; border-radius:50%; background:var(--success); display:inline-block; animation:pulse 1.5s infinite; margin-right:3px; }

/* SCROLLBAR */
::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }
</style>
</head>
<body>

<!-- DAILY PIN -->
<div id="daily-pin-screen" style="display:none;position:fixed;inset:0;background:var(--accent);z-index:99999;align-items:center;justify-content:center;flex-direction:column">
  <div style="background:white;border-radius:20px;padding:40px 36px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="font-size:32px;margin-bottom:8px">🔒</div>
    <div style="font-size:18px;font-weight:800;color:#1a1a2e;margin-bottom:4px">Buongiorno</div>
    <div style="font-size:13px;color:#666;margin-bottom:24px">Inserisci il PIN per sbloccare la postazione</div>
    <input type="password" id="daily-pin-input" placeholder="PIN" maxlength="8"
      style="width:100%;padding:12px;border-radius:10px;border:2px solid #E2E8F0;font-size:22px;letter-spacing:6px;text-align:center;margin-bottom:12px;outline:none"
      onkeydown="if(event.key==='Enter')verificaPinGiornaliero()">
    <div id="daily-pin-err" style="color:#ef4444;font-size:12px;margin-bottom:12px;height:16px"></div>
    <button onclick="verificaPinGiornaliero()" style="width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:white;font-size:15px;font-weight:800;cursor:pointer">Sblocca</button>
    <div style="margin-top:16px;font-size:11px;color:#999">PIN di default: 1234</div>
  </div>
</div>


<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-logo">
      <div class="header-logo-icon">
        <svg viewBox="0 0 24 24" fill="white" style="width:20px;height:20px"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      </div>
      <div>
        <div class="header-title">ORMIA — Postazione Timbratura</div>
        <div class="header-sub">Seleziona commessa → identifica meccanico → timbra</div>
      </div>
    </div>
    <div class="header-clock" id="clock">--:--:--</div>
  </div>

  <div class="main">
    <!-- LEFT: TIMBRATURA -->
    <div class="panel-left" id="panel-left"></div>

    <!-- RIGHT: CALENDARIO -->
    <div class="panel-right" id="panel-right"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPA_URL = 'https://crcfwmkemnwippplteqm.supabase.co';
const SUPA_KEY = 'sb_publishable_bzZrugm5WWBaUKkO_mlrLw_dNXKPCM9';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

// ─── DATA ───────────────────────────────────────────────
let meccanici=[], commesse=[], clienti=[], veicoli=[], timbrature=[], presenze=[], appuntamenti=[];

// ─── LEFT STATE ─────────────────────────────────────────
let timView = 'list';   // 'list' | 'mec-picker' | 'actions'
let comSel  = null;
let mecSel  = null;
let comFilter = '';

// ─── RIGHT STATE ────────────────────────────────────────
let calDate      = new Date();
let calView      = 'month'; // 'month' | 'events' | 'add-form'
let calEvts      = [];
let calMonthDate = new Date(); // mese visualizzato nella griglia
let calMonthEvts = {};         // { 'YYYY-MM-DD': ['appuntamento'|'consegna'] }
let inactivityTimer = null;

// ─── LOAD ───────────────────────────────────────────────
async function loadAll() {
  const oggi = new Date().toISOString().split('T')[0];
  const [m, co, cl, v, t, p] = await Promise.all([
    supa.from('meccanici').select('*'),
    supa.from('commesse').select('*'),
    supa.from('clienti').select('*'),
    supa.from('veicoli').select('*'),
    supa.from('timbrature').select('*'),
    supa.from('presenze').select('*').gte('data', oggi),
  ]);
  meccanici  = m.data  || [];
  commesse   = co.data || [];
  clienti    = cl.data || [];
  veicoli    = v.data  || [];
  timbrature = t.data  || [];
  presenze   = p.data  || [];
  renderLeft();
}

async function loadCalDate(d) {
  const ds = d.toISOString().split('T')[0];
  const [a, co] = await Promise.all([
    supa.from('appuntamenti').select('*').gte('data_ora', ds+'T00:00:00').lte('data_ora', ds+'T23:59:59'),
    supa.from('commesse').select('*').eq('consegna_prevista', ds),
  ]);
  const evts = [];
  (a.data||[]).forEach(ap => {
    const cl = clienti.find(c=>c.id===ap.cliente_id);
    const vv = veicoli.find(x=>x.id===ap.veicolo_id);
    evts.push({ ora: new Date(ap.data_ora), titolo: ap.titolo||'Appuntamento', sub: [cl?.ragione, vv?.targa].filter(Boolean).join(' · '), note: ap.note, tipo:'appuntamento' });
  });
  (co.data||[]).forEach(cm => {
    const vv = veicoli.find(x=>x.id===cm.veicolo_id);
    const cl = clienti.find(x=>x.id===cm.cliente_id);
    evts.push({ ora: new Date(cm.consegna_prevista), titolo:`Consegna ${vv?.targa||cm.numero}`, sub: cl?.ragione||'', note:'', tipo:'consegna' });
  });
  evts.sort((a,b)=>a.ora-b.ora);
  calEvts = evts;
}

async function loadCalMonth() {
  const y = calMonthDate.getFullYear();
  const m = calMonthDate.getMonth();
  const firstDay = new Date(y, m, 1).toISOString().split('T')[0];
  const lastDay  = new Date(y, m+1, 0).toISOString().split('T')[0];
  const [a, co] = await Promise.all([
    supa.from('appuntamenti').select('data_ora').gte('data_ora', firstDay+'T00:00:00').lte('data_ora', lastDay+'T23:59:59'),
    supa.from('commesse').select('consegna_prevista').gte('consegna_prevista', firstDay).lte('consegna_prevista', lastDay),
  ]);
  calMonthEvts = {};
  (a.data||[]).forEach(ap => {
    const ds = ap.data_ora.split('T')[0];
    if (!calMonthEvts[ds]) calMonthEvts[ds] = [];
    calMonthEvts[ds].push('appuntamento');
  });
  (co.data||[]).forEach(cm => {
    const ds = cm.consegna_prevista;
    if (!ds) return;
    if (!calMonthEvts[ds]) calMonthEvts[ds] = [];
    calMonthEvts[ds].push('consegna');
  });
}

// ─── CLOCK ──────────────────────────────────────────────
function aggiornaOrologio() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('it-IT');
}
setInterval(aggiornaOrologio, 1000);
aggiornaOrologio();

// ─── AUTO REFRESH ───────────────────────────────────────
setInterval(async () => {
  const oggi = new Date().toISOString().split('T')[0];
  const [t, co, p] = await Promise.all([
    supa.from('timbrature').select('*'),
    supa.from('commesse').select('*'),
    supa.from('presenze').select('*').gte('data', oggi),
  ]);
  timbrature = t.data || [];
  commesse   = co.data || [];
  presenze   = p.data || [];
  if (timView === 'list') renderLeft();
}, 8000);

// ─── INACTIVITY (30s → torna al mese corrente) ──────────
function resetInactivity() {
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    calDate = new Date(); calMonthDate = new Date(); calView = 'month';
    renderRight();
  }, 30000);
}
document.addEventListener('click', resetInactivity);
document.addEventListener('keydown', resetInactivity);

// ─── HELPERS ────────────────────────────────────────────
function isGaranzia(cm) { return cm?.tipo === 'garanzia' || cm?.garanzia === true; }
function initials(nome) { return (nome||'?').split(' ').map(w=>w[0]).join('').substr(0,2).toUpperCase(); }

const RUOLI_OPERATIVI = ['meccanico','capo officina','elettrauto','apprendista'];
function isOperativo(mec) { return RUOLI_OPERATIVI.includes((mec?.ruolo||'').toLowerCase()); }

function showToast(msg, dur=3000) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}
function suona(tipo) {
  try { const ctx=new AudioContext(), o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=tipo==='entrata'?880:440; g.gain.setValueAtTime(.3,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4); o.start(); o.stop(ctx.currentTime+.4); } catch(e){}
}

// ─── RENDER LEFT ────────────────────────────────────────
function renderLeft() {
  const el = document.getElementById('panel-left');
  if (timView === 'list')       el.innerHTML = buildListView();
  else if (timView === 'mec-picker') el.innerHTML = buildMecPicker();
  else if (timView === 'actions')    el.innerHTML = buildActions();
}

function buildListView() {
  const stati = ['aperta','wip','standby'];
  let lista = commesse.filter(c => stati.includes(c.stato));
  if (comFilter) {
    const q = comFilter.toLowerCase();
    lista = lista.filter(c => {
      const v = veicoli.find(x=>x.id===c.veicolo_id);
      const cl = clienti.find(x=>x.id===c.cliente_id);
      return (c.numero||'').toLowerCase().includes(q)
        || (c.descrizione||c.desc||'').toLowerCase().includes(q)
        || (v?.targa||'').toLowerCase().includes(q)
        || (cl?.ragione||'').toLowerCase().includes(q);
    });
  }
  lista.sort((a,b) => {
    const ord = {wip:0, aperta:1, standby:2};
    return (ord[a.stato]??3)-(ord[b.stato]??3);
  });

  const inLavorazione = timbrature.filter(t=>!t.uscita).length;

  return `
  <div style="padding:16px 18px 10px;border-bottom:1px solid var(--border);flex-shrink:0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span class="sec-title">Commesse attive</span>
      ${inLavorazione ? `<span style="font-size:12px;color:var(--success);font-weight:600"><span class="dot"></span>${inLavorazione} al lavoro</span>` : ''}
    </div>
    <input type="text" class="badge-input" style="font-size:13px;letter-spacing:0;text-transform:none;padding:9px 12px"
      placeholder="🔍 Cerca per numero, targa, cliente…"
      value="${comFilter}"
      oninput="comFilter=this.value;renderLeft()">
  </div>
  <div class="com-list" style="padding:12px 18px;flex:1;overflow-y:auto">
    ${lista.length ? lista.map(cm => {
      const v  = veicoli.find(x=>x.id===cm.veicolo_id);
      const cl = clienti.find(x=>x.id===cm.cliente_id);
      const attivi = timbrature.filter(t=>t.com_id===cm.id&&!t.uscita).map(t=>meccanici.find(m=>m.id===t.mec_id)?.nome.split(' ')[0]).filter(Boolean);
      const garTag = isGaranzia(cm) ? `<span style="font-size:10px;background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 5px;font-weight:700;margin-left:4px">GARANZIA</span>` : '';
      return `<div class="com-sel-card ${cm.stato}" onclick="selezionaCommessa('${cm.id}')">
        <div class="bar"></div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
            <span style="font-size:11px;font-weight:800;color:var(--text3)">${cm.numero||''}</span>
            <span class="stato-chip ${cm.stato}">${cm.stato==='wip'?'In lavorazione':cm.stato==='standby'?'Standby':'Aperta'}</span>
            ${garTag}
          </div>
          <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cm.descrizione||cm.desc||'—'}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px">${cl?.ragione||''}</div>
          ${attivi.length ? `<div style="font-size:10px;color:var(--success);margin-top:3px"><span class="dot"></span>${attivi.join(', ')}</div>` : ''}
        </div>
        ${v ? `<span class="targa-chip">${v.targa}</span>` : ''}
      </div>`;
    }).join('') : `<div style="padding:40px 0;text-align:center;color:var(--text3);font-size:13px">Nessuna commessa attiva</div>`}
  </div>`;
}

function selezionaCommessa(id) {
  comSel = commesse.find(c=>c.id===id);
  timView = 'mec-picker';
  mecSel = null;
  renderLeft();
}

function buildMecPicker() {
  const v  = veicoli.find(x=>x.id===comSel?.veicolo_id);

function selezionaMeccanico(id) {
  mecSel = meccanici.find(m=>m.id===id);
  timView = 'actions';
  renderLeft();
}

async function cercaMeccanicoBadge(val) {
  const v = val.trim().toUpperCase();
  if (!v) return;
  const mec = meccanici.find(m => (m.badge||'').toUpperCase()===v || (m.pin||'')===v || m.id.toUpperCase().startsWith(v));
  if (!mec) { showToast('Badge non trovato'); return; }
  if (!isOperativo(mec)) {
    // Non operativo: solo presenza giornaliera
    const oggi = new Date().toISOString().split('T')[0];
    const p = presenze.find(x=>x.mec_id===mec.id&&(x.data||'').startsWith(oggi));
    await registraPresenzaGiornaliera(mec, p);
    return;
  }
  selezionaMeccanico(mec.id);
}

// ─── TIMBRATURA AZIONI ──────────────────────────────────
async function avviaEntrata() {
  if (!mecSel || !comSel) return;
  const ora = new Date().toISOString();
  try {
    // Chiudi timbrature aperte su altre commesse
    const altreAperte = timbrature.filter(t=>t.mec_id===mecSel.id&&!t.uscita&&t.com_id!==comSel.id);
    for (const t of altreAperte) await supa.from('timbrature').update({uscita:ora}).eq('id',t.id);
    // Nuova timbratura
    await supa.from('timbrature').insert({ id:crypto.randomUUID(), mec_id:mecSel.id, com_id:comSel.id, entrata:ora, uscita:null, created_at:ora });
    // Porta in wip se aperta o standby
    if (comSel.stato==='aperta'||comSel.stato==='standby') await supa.from('commesse').update({stato:'wip'}).eq('id',comSel.id);
    showToast(`✓ ${mecSel.nome} — ENTRATA su ${comSel.numero}`);
    suona('entrata');
    await loadAll();
    setTimeout(resetTim, 3000);
  } catch(e) { showToast('Errore: '+e.message); }
}

async function avviaPausa() {
  if (!mecSel || !comSel) return;
  const tAperta = timbrature.find(t=>t.mec_id===mecSel.id&&t.com_id===comSel.id&&!t.uscita);
  if (!tAperta) return;
  const ora = new Date().toISOString();
  try {
    await supa.from('timbrature').update({uscita:ora}).eq('id',tAperta.id);
    // Se nessun altro attivo → standby
    const altreAttive = timbrature.filter(x=>x.com_id===comSel.id&&!x.uscita&&x.id!==tAperta.id);
    if (!altreAttive.length) await supa.from('commesse').update({stato:'standby'}).eq('id',comSel.id);
    showToast(`⏸ ${mecSel.nome} — pausa registrata`);
    suona('uscita');
    await loadAll();
    setTimeout(resetTim, 3000);
  } catch(e) { showToast('Errore: '+e.message); }
}

async function avviaFine() {
  await avviaPausa(); // stessa cosa — uscita + standby se nessun altro
}

async function avviaChiudi() {
  if (!mecSel || !comSel) return;
  if (!confirm(`Chiudere la commessa ${comSel.numero}? L'operazione non è reversibile da questa postazione.`)) return;
  const ora = new Date().toISOString();
  try {
    // Chiudi tutte le timbrature aperte su questa commessa
    const aperte = timbrature.filter(t=>t.com_id===comSel.id&&!t.uscita);
    for (const t of aperte) await supa.from('timbrature').update({uscita:ora}).eq('id',t.id);
    // Chiudi commessa
    await supa.from('commesse').update({stato:'chiusa'}).eq('id',comSel.id);
    showToast(`🔒 Commessa ${comSel.numero} chiusa`);
    suona('uscita');
    await loadAll();
    setTimeout(resetTim, 3000);
  } catch(e) { showToast('Errore: '+e.message); }
}

function resetTim() {
  timView='list'; comSel=null; mecSel=null; comFilter=''; renderLeft();
}

// ─── PRESENZA GIORNALIERA (non operativi) ───────────────
async function registraPresenzaGiornaliera(mec, presenzaEsistente) {
  const ora=new Date().toISOString(), oggi=new Date().toISOString().split('T')[0];
  try {
    if (presenzaEsistente && !presenzaEsistente.uscita) {
      await supa.from('presenze').update({uscita:ora}).eq('id',presenzaEsistente.id);
      showToast(`✓ ${mec.nome} — USCITA registrata`); suona('uscita');
    } else if (!presenzaEsistente) {
      await supa.from('presenze').insert({ id:crypto.randomUUID(), mec_id:mec.id, data:oggi, entrata:ora, uscita:null, created_at:ora });
      showToast(`✓ ${mec.nome} — ENTRATA registrata`); suona('entrata');
    }
    await loadAll();
    setTimeout(resetTim, 3000);
  } catch(e) { showToast('Errore: '+e.message); }
}

// ─── RENDER RIGHT (CALENDARIO) ──────────────────────────
async function renderRight() {
  const el = document.getElementById('panel-right');
  if (calView === 'month') {
    await loadCalMonth();
    el.innerHTML = buildMonthView();
  } else if (calView === 'events') {
    await loadCalDate(calDate);
    el.innerHTML = buildEventsView();
  } else {
    el.innerHTML = buildAddFormView();
  }
}

function buildMonthView() {
  const oggi = new Date();
  const y = calMonthDate.getFullYear();
  const m = calMonthDate.getMonth();
  const label = calMonthDate.toLocaleDateString('it-IT', { month:'long', year:'numeric' });
  const isThisMonth = y === oggi.getFullYear() && m === oggi.getMonth();
  const todayStr = oggi.toISOString().split('T')[0];

  // Griglia: partendo dal lunedì precedente il 1° del mese
  const firstDay = new Date(y, m, 1);
  const startDow = firstDay.getDay(); // 0=Dom
  const offset   = startDow === 0 ? 6 : startDow - 1;
  const start    = new Date(y, m, 1 - offset);

  const dows = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];

  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d  = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const isCurrentMonth = d.getMonth() === m;
    const isToday        = ds === todayStr;
    const evts           = calMonthEvts[ds] || [];
    const hasApt = evts.includes('appuntamento');
    const hasCon = evts.includes('consegna');
    cells += `<div class="cal-day-cell${isCurrentMonth?'':' other-month'}${isToday?' today':''}" onclick="apriGiorno('${ds}')">
      <div class="cal-day-num">${d.getDate()}</div>
      ${evts.length ? `<div class="cal-day-dots">
        ${hasApt ? `<div class="cal-day-dot" style="background:var(--accent)"></div>` : ''}
        ${hasCon ? `<div class="cal-day-dot" style="background:var(--warning)"></div>` : ''}
      </div>` : ''}
    </div>`;
  }

  return `
  <div class="cal-month-header">
    <button class="cal-nav-btn" onclick="cambiaeMese(-1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:14px;height:14px"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div style="text-align:center">
      <div class="cal-date-label" style="text-transform:capitalize">${label}</div>
      ${!isThisMonth ? `<button class="cal-oggi-chip" onclick="tornaOggi()">Questo mese</button>` : ''}
    </div>
    <button class="cal-nav-btn" onclick="cambiaeMese(1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:14px;height:14px"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div class="cal-month-body">
    <div class="cal-dow-row">
      ${dows.map(d => `<div class="cal-dow-cell">${d}</div>`).join('')}
    </div>
    <div class="cal-days-grid">${cells}</div>
  </div>
  <div class="cal-add-bar">
    <button class="cal-add-btn" onclick="apriFormApt()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nuovo appuntamento
    </button>
  </div>`;
}

function buildEventsView() {
  const oggi = new Date();
  const isOggi = calDate.toDateString() === oggi.toDateString();
  const label = isOggi ? 'Oggi' : calDate.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  const ora = new Date();

  return `
  <div style="padding:10px 24px 0;flex-shrink:0">
    <button class="back-btn" onclick="calView='month';renderRight()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:14px;height:14px"><polyline points="15 18 9 12 15 6"/></svg>
      Calendario
    </button>
  </div>
  <div class="cal-nav">
    <button class="cal-nav-btn" onclick="cambiaGiorno(-1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:14px;height:14px"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div style="text-align:center">
      <div class="cal-date-label">${label}</div>
      ${!isOggi?`<button class="cal-oggi-chip" onclick="tornaOggi()">Torna a oggi</button>`:''}
    </div>
    <button class="cal-nav-btn" onclick="cambiaGiorno(1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:14px;height:14px"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div class="cal-events">
    ${calEvts.length ? calEvts.map(e => {
      const passato = e.ora < ora;
      const oraStr  = e.ora.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
      const colore  = e.tipo==='consegna'?'var(--warning)':'var(--accent)';
      const icona   = e.tipo==='consegna'?'🚗':'📋';
      return `<div class="cal-event" style="opacity:${passato?.55:1}">
        <div class="cal-event-time" style="color:${colore}">${oraStr}</div>
        <div class="cal-event-body">
          <div class="cal-event-title">${icona} ${e.titolo}</div>
          ${e.sub?`<div class="cal-event-sub">${e.sub}</div>`:''}
          ${e.note?`<div class="cal-event-note">${e.note}</div>`:''}
        </div>
        ${!passato?`<div style="width:8px;height:8px;border-radius:50%;background:${colore};flex-shrink:0;margin-top:4px"></div>`:''}

    }).join('') : `<div class="cal-empty">Nessun appuntamento per questo giorno</div>`}
  </div>
  <div class="cal-add-bar">
    <button class="cal-add-btn" onclick="apriFormApt()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nuovo appuntamento

  </div>`;
}

async function salvaAppuntamento() {
  const dt   = document.getElementById('apt-dt').value;
  const tit  = document.getElementById('apt-titolo').value.trim();
  const targ = document.getElementById('apt-targa').value.trim().toUpperCase();
  const cliN = document.getElementById('apt-cliente').value.trim();
  const note = document.getElementById('apt-note').value.trim();
  if (!dt || !tit) { showToast('Compila data e descrizione'); return; }

  const vV = targ ? veicoli.find(x=>x.targa?.toUpperCase()===targ) : null;
  const cV = cliN ? clienti.find(x=>x.ragione?.toLowerCase()===cliN.toLowerCase()) : null;

  try {
    await supa.from('appuntamenti').insert({
      id: crypto.randomUUID(),
      data_ora: new Date(dt).toISOString(),
      titolo: tit,
      note: [note, targ&&!vV?`Targa: ${targ}`:null, cliN&&!cV?`Cliente: ${cliN}`:null].filter(Boolean).join(' · ') || null,
      cliente_id: cV?.id||null,
      veicolo_id: vV?.id||null,
      created_at: new Date().toISOString(),
    });
    showToast('✓ Appuntamento salvato');
    // Mostra il giorno dell'appuntamento appena salvato
    calDate = new Date(dt);
    calView = 'events';
    await renderRight();
    resetInactivity();
  } catch(e) { showToast('Errore: '+e.message); }
}

function apriFormApt() { calView='add-form'; renderRight(); }

async function apriGiorno(ds) {
  // Parsing locale per evitare shift UTC
  const parts = ds.split('-');
  calDate = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  calView = 'events';
  await renderRight();
}

async function cambiaGiorno(delta) {
  calDate = new Date(calDate);
  calDate.setDate(calDate.getDate()+delta);
  calView='events';
  await renderRight();
}

async function cambiaeMese(delta) {
  calMonthDate = new Date(calMonthDate.getFullYear(), calMonthDate.getMonth() + delta, 1);
  await renderRight();
}

async function tornaOggi() {
  calDate = new Date(); calView='events';
  await renderRight();
}

// ─── PIN GIORNALIERO ────────────────────────────────────
function controllaPinGiornaliero() {
  const oggi=new Date().toDateString();
  if (localStorage.getItem('ormia_tim_daily_unlock')===oggi) return;
  const s=document.getElementById('daily-pin-screen'); s.style.display='flex';
  setTimeout(()=>document.getElementById('daily-pin-input').focus(),100);
}

function verificaPinGiornaliero() {
  const pin=document.getElementById('daily-pin-input').value;
  const saved=localStorage.getItem('ormia_tim_admin_pin')||'1234';
  if (pin===saved) {
    localStorage.setItem('ormia_tim_daily_unlock',new Date().toDateString());
    document.getElementById('daily-pin-screen').style.display='none';
    document.getElementById('daily-pin-err').textContent='';
  } else {
    document.getElementById('daily-pin-err').textContent='PIN errato, riprova';
    document.getElementById('daily-pin-input').value='';
    document.getElementById('daily-pin-input').focus();
  }
}

// ─── INIT ───────────────────────────────────────────────
(async ()=>{
  await loadAll();
  renderLeft();
  await renderRight();
  controllaPinGiornaliero();
})();
</script>
</body>
</html>
